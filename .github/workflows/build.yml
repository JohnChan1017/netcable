name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-windows:
    name: Windows (build + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj

      - name: Build
        run: dotnet build src/NetCable.Desktop/NetCable.Desktop.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet run --project tests/NetCable.Tests/NetCable.Tests.csproj -c Release

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj
          -c Release -r win-x64
          -o out/win-x64

      - name: Resolve version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = "1.0.0" }
          "NC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本: $v"

      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI (perUser)
        shell: pwsh
        run: |
          wix build installer/Product.wxs `
            -o "out/NetCable-$env:NC_VERSION-win-x64.msi" `
            -arch x64 `
            -d "Version=$env:NC_VERSION" `
            -d "SourceDir=$PWD/out/win-x64" `
            -d "IconPath=$PWD/src/NetCable.Desktop/Assets/netcable.ico" `
            -d "LicenseRtf=$PWD/installer/License.rtf" `
            -d "InstallScope=perUser" `
            -ext WixToolset.UI.wixext

      - name: Build MSI (perMachine)
        shell: pwsh
        run: |
          wix build installer/Product.wxs `
            -o "out/NetCable-$env:NC_VERSION-win-x64-perMachine.msi" `
            -arch x64 `
            -d "Version=$env:NC_VERSION" `
            -d "SourceDir=$PWD/out/win-x64" `
            -d "IconPath=$PWD/src/NetCable.Desktop/Assets/netcable.ico" `
            -d "LicenseRtf=$PWD/installer/License.rtf" `
            -d "InstallScope=perMachine" `
            -ext WixToolset.UI.wixext

      - name: Package portable zip
        shell: pwsh
        run: |
          Remove-Item out/win-x64/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "out/win-x64/*" -DestinationPath "out/NetCable-$env:NC_VERSION-win-x64-portable.zip" -CompressionLevel Optimal
          Get-ChildItem out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # ============================================================
      # SignPath 代码签名（默认禁用）
      #
      # 启用条件（仓库 Settings → Secrets and variables → Actions）：
      #   Variables:
      #     SIGNPATH_ORGANIZATION_ID      SignPath 组织 ID
      #     SIGNPATH_PROJECT_SLUG         netcable
      #     SIGNPATH_SIGNING_POLICY_SLUG  release-signing
      #   Secrets:
      #     SIGNPATH_API_TOKEN            SignPath 生成的 API Token
      #
      # 只要 SIGNPATH_PROJECT_SLUG 为空，以下步骤全部跳过（CI 行为不变）。
      # 证书/Token 就绪后：填上变量即可自动签名，无需改本文件。
      # ============================================================
      - name: Upload unsigned artifacts for signing
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            out/*.msi
            out/win-x64/NetCable.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: sign
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/signed

      - name: Replace with signed binaries and repack
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          # 签名后的 exe 覆盖回 publish 目录，MSI 覆盖回 out/
          $signedExe = Get-ChildItem out/signed -Recurse -Filter NetCable.exe | Select-Object -First 1
          if (-not $signedExe) { throw "签名产物里找不到 NetCable.exe" }
          Copy-Item $signedExe.FullName out/win-x64/NetCable.exe -Force
          Get-ChildItem out/signed -Recurse -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName "out/$($_.Name)" -Force
            Write-Host "已替换签名 MSI: $($_.Name)"
          }
          Remove-Item "out/NetCable-$env:NC_VERSION-win-x64-portable.zip" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "out/win-x64/*" -DestinationPath "out/NetCable-$env:NC_VERSION-win-x64-portable.zip" -CompressionLevel Optimal

      - name: Verify signatures
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $exe = Get-AuthenticodeSignature out/win-x64/NetCable.exe
          Write-Host "NetCable.exe 签名状态: $($exe.Status)  签名者: $($exe.SignerCertificate.Subject)"
          if ($exe.Status -ne 'Valid') { throw "NetCable.exe 签名校验失败: $($exe.Status)" }
          Get-ChildItem out -Filter *.msi | ForEach-Object {
            Write-Host "MSI: $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcable-windows
          path: |
            out/*.msi
            out/*.zip

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.msi
            out/*.zip
          generate_release_notes: true

  build-linux:
    name: Linux (publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj
      - run: dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj -c Release -r linux-x64 -o out/linux-x64
      - name: Package
        shell: bash
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"; [ -z "$v" ] && v="1.0.0"
          chmod +x out/linux-x64/NetCable
          printf '#!/usr/bin/env sh\ncd "$(dirname "$0")"\nchmod +x ./NetCable 2>/dev/null || true\nexec ./NetCable "$@"\n' > out/linux-x64/netcable.sh
          chmod +x out/linux-x64/netcable.sh
          tar -czf "out/NetCable-$v-linux-x64.tar.gz" -C out linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: netcable-linux
          path: out/*.tar.gz

  build-macos:
    name: macOS (publish, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj
      - run: dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj -c Release -r osx-arm64 -o out/osx-arm64
      - name: Package
        shell: bash
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"; [ -z "$v" ] && v="1.0.0"
          chmod +x out/osx-arm64/NetCable
          printf '#!/usr/bin/env sh\ncd "$(dirname "$0")"\nxattr -dr com.apple.quarantine . 2>/dev/null || true\nchmod +x ./NetCable 2>/dev/null || true\nexec ./NetCable "$@"\n' > out/osx-arm64/netcable.sh
          chmod +x out/osx-arm64/netcable.sh
          tar -czf "out/NetCable-$v-osx-arm64.tar.gz" -C out osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: netcable-macos
          path: out/*.tar.gz
