name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-windows:
    name: Windows (build + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj

      - name: Build
        run: dotnet build src/NetCable.Desktop/NetCable.Desktop.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet run --project tests/NetCable.Tests/NetCable.Tests.csproj -c Release

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj
          -c Release -r win-x64
          -o out/win-x64

      - name: Resolve version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = "1.0.0" }
          "NC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本: $v"

      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI (perUser)
        shell: pwsh
        run: |
          wix build installer/Product.wxs `
            -o "out/NetCable-$env:NC_VERSION-win-x64.msi" `
            -arch x64 `
            -d "Version=$env:NC_VERSION" `
            -d "SourceDir=$PWD/out/win-x64" `
            -d "IconPath=$PWD/src/NetCable.Desktop/Assets/netcable.ico" `
            -d "LicenseRtf=$PWD/installer/License.rtf" `
            -d "InstallScope=perUser" `
            -ext WixToolset.UI.wixext

      - name: Build MSI (perMachine)
        shell: pwsh
        run: |
          wix build installer/Product.wxs `
            -o "out/NetCable-$env:NC_VERSION-win-x64-perMachine.msi" `
            -arch x64 `
            -d "Version=$env:NC_VERSION" `
            -d "SourceDir=$PWD/out/win-x64" `
            -d "IconPath=$PWD/src/NetCable.Desktop/Assets/netcable.ico" `
            -d "LicenseRtf=$PWD/installer/License.rtf" `
            -d "InstallScope=perMachine" `
            -ext WixToolset.UI.wixext

      - name: Package portable zip
        shell: pwsh
        run: |
          Remove-Item out/win-x64/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "out/win-x64/*" -DestinationPath "out/NetCable-$env:NC_VERSION-win-x64-portable.zip" -CompressionLevel Optimal
          Get-ChildItem out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcable-windows
          path: |
            out/*.msi
            out/*.zip

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.msi
            out/*.zip
          generate_release_notes: true

  build-linux:
    name: Linux (publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj
      - run: dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj -c Release -r linux-x64 -o out/linux-x64
      - name: Package
        shell: bash
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"; [ -z "$v" ] && v="1.0.0"
          chmod +x out/linux-x64/NetCable
          printf '#!/usr/bin/env sh\ncd "$(dirname "$0")"\nchmod +x ./NetCable 2>/dev/null || true\nexec ./NetCable "$@"\n' > out/linux-x64/netcable.sh
          chmod +x out/linux-x64/netcable.sh
          tar -czf "out/NetCable-$v-linux-x64.tar.gz" -C out linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: netcable-linux
          path: out/*.tar.gz

  build-macos:
    name: macOS (publish, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/NetCable.Desktop/NetCable.Desktop.csproj
      - run: dotnet publish src/NetCable.Desktop/NetCable.Desktop.csproj -c Release -r osx-arm64 -o out/osx-arm64
      - name: Package
        shell: bash
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"; [ -z "$v" ] && v="1.0.0"
          chmod +x out/osx-arm64/NetCable
          printf '#!/usr/bin/env sh\ncd "$(dirname "$0")"\nxattr -dr com.apple.quarantine . 2>/dev/null || true\nchmod +x ./NetCable 2>/dev/null || true\nexec ./NetCable "$@"\n' > out/osx-arm64/netcable.sh
          chmod +x out/osx-arm64/netcable.sh
          tar -czf "out/NetCable-$v-osx-arm64.tar.gz" -C out osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: netcable-macos
          path: out/*.tar.gz
